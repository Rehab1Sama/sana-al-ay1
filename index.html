<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة سَنا الآي المتكاملة</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { font-family: 'Tajawal', sans-serif; font-style: normal !important; transition: all 0.3s ease; }
        body { background-color: #f8f7ff; margin: 0; overflow-x: hidden; }
        .navy-blue { color: #2d3a6d; }
        .navy-bg { background-color: #2d3a6d; }
        .sidebar { width: 280px; height: 100vh; background: white; border-left: 2px solid #f3e8ff; position: fixed; right: 0; top: 0; z-index: 100; transform: translateX(100%); }
        .sidebar.active { transform: translateX(0); }
        .main-content { margin-right: 0; width: 100%; padding: 20px; }
        @media (min-width: 1024px) { .sidebar { transform: translateX(0); } .main-content { margin-right: 280px; } }
        .card-custom { background: white; border-radius: 35px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid #f1f5f9; }
        .juz-box { width: 35px; height: 35px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 10px; border: 1px solid #eee; }
        .juz-done { background: #8b5cf6; color: white; border-color: #8b5cf6; }
        .hidden { display: none !important; }
        .btn-role { padding: 10px; border-radius: 15px; font-size: 12px; font-weight: bold; border: 1px solid #eee; text-align: center; cursor: pointer; }
        .active-role { background: #2d3a6d; color: white; }
    </style>
</head>
<body>

    <!-- زر القائمة للجوال -->
    <button onclick="toggleSidebar()" class="fixed top-4 right-4 z-[110] bg-white p-3 rounded-2xl shadow-lg lg:hidden">
        <i class="fas fa-bars navy-blue"></i>
    </button>

    <!-- الشريط الجانبي -->
    <aside id="sidebar" class="sidebar p-6 flex flex-col gap-6 shadow-xl">
        <div class="text-center">
            <img src="https://i.ibb.co/GfyXZGkG/IMG-20260408-WA0004.jpg" class="w-20 mx-auto mb-2">
            <h1 class="text-lg font-black navy-blue uppercase">سَنا الآي</h1>
        </div>

        <div id="userInfo" class="bg-purple-50 p-4 rounded-3xl text-center">
            <p id="userNameDisplay" class="text-xs font-bold navy-blue">جاري التحميل...</p>
            <p id="userRoleDisplay" class="text-[10px] text-purple-500 font-bold uppercase italic"></p>
        </div>

        <!-- أزرار التنقل الذكية -->
        <nav class="flex flex-col gap-2 overflow-y-auto max-h-[50vh]" id="navMenu">
            <!-- ستظهر هنا الأزرار بناءً على الرتبة -->
        </nav>

        <button onclick="logout()" class="mt-auto p-4 text-red-400 text-xs font-bold border-t flex items-center gap-2">
            <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
        </button>
    </aside>

    <main class="main-content">
        <!-- صفحة الدخول (تختفي بعد الدخول) -->
        <section id="loginSection" class="flex items-center justify-center min-h-[80vh]">
            <div class="max-w-md w-full bg-white p-10 rounded-[50px] shadow-2xl text-center">
                <img src="https://i.ibb.co/GfyXZGkG/IMG-20260408-WA0004.jpg" class="w-24 mx-auto mb-6">
                <h2 class="text-2xl font-black navy-blue mb-8">منظومة سَنا الآي</h2>
                <div class="space-y-4">
                    <input type="email" id="email" placeholder="البريد الإلكتروني" class="w-full p-4 rounded-2xl bg-gray-50 outline-none ring-1 ring-gray-200 focus:ring-2 focus:ring-purple-400">
                    <input type="password" id="password" placeholder="كلمة المرور" class="w-full p-4 rounded-2xl bg-gray-50 outline-none ring-1 ring-gray-200 focus:ring-2 focus:ring-purple-400">
                    <button onclick="handleLogin()" class="w-full py-4 navy-bg text-white font-bold rounded-2xl shadow-lg">دخول المنظومة</button>
                </div>
            </div>
        </section>

        <!-- لوحة تحكم القائدة -->
        <section id="leaderDash" class="hidden space-y-8">
            <h2 class="text-2xl font-black navy-blue">لوحة القائدة 🌸</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="card-custom p-6 border-r-8 border-purple-500">
                    <p class="text-gray-400 text-[10px] font-bold">أوجه الحفظ اليوم</p>
                    <h3 class="text-3xl font-black navy-blue mt-2">145.5</h3>
                </div>
                <div class="card-custom p-6 border-r-8 border-red-500">
                    <p class="text-gray-400 text-[10px] font-bold">إنذارات غياب</p>
                    <h3 class="text-3xl font-black text-red-500 mt-2">5</h3>
                </div>
                <div class="card-custom p-6 border-r-8 border-blue-500">
                    <p class="text-gray-400 text-[10px] font-bold">تقصيرات نشطة</p>
                    <h3 class="text-3xl font-black text-blue-500 mt-2">12</h3>
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <button onclick="showSection('managerDash')" class="p-8 bg-white border-2 border-dashed border-purple-200 rounded-[40px] font-bold navy-blue">
                    <i class="fas fa-tasks mb-2 block text-2xl"></i> إدارة المسارات والمهام
                </button>
                <button onclick="showSection('storeBuilder')" class="p-8 bg-white border-2 border-dashed border-blue-200 rounded-[40px] font-bold navy-blue">
                    <i class="fas fa-store mb-2 block text-2xl"></i> باني المتجر والمنتجات
                </button>
            </div>
        </section>

        <!-- لوحة مدخلة البيانات -->
        <section id="entryDash" class="hidden space-y-6">
            <h2 class="text-2xl font-black navy-blue">إدخال الإنجاز اليومي</h2>
            <div class="card-custom p-8 space-y-6">
                <select id="circleSelect" class="w-full p-4 bg-gray-50 rounded-2xl outline-none border-none ring-1 ring-gray-200 font-bold">
                    <option>-- اختر الحلقة --</option>
                </select>
                
                <div id="studentList" class="space-y-4">
                    <!-- الأسماء ستظهر هنا وتختفي بعد الإدخال -->
                    <p class="text-center text-gray-400 text-xs italic italic italic">يرجى اختيار الحلقة أولاً</p>
                </div>
            </div>
        </section>

        <!-- لوحة الطالبة -->
        <section id="studentDash" class="hidden space-y-8">
            <div class="flex justify-between items-center bg-white p-6 rounded-[40px] shadow-sm">
                <h2 id="stWelcome" class="text-xl font-black navy-blue italic">أهلاً بكِ 🌸</h2>
                <span class="text-2xl">👑 ⭐</span>
            </div>
            <div id="juzMap" class="card-custom p-8 grid grid-cols-6 md:grid-cols-10 gap-3"></div>
            <!-- مشغل القرآن -->
            <div class="card-custom p-8 text-center border-2 border-blue-50">
                 <p class="text-[10px] text-blue-400 font-bold mb-4 uppercase">محراب السماع</p>
                 <div class="bg-blue-50 p-6 rounded-[30px] mb-6">
                     <p class="font-bold navy-blue">سورة مريم (1-15)</p>
                 </div>
                 <div class="flex justify-center gap-10 text-3xl text-blue-600">
                     <button><i class="fas fa-play"></i></button>
                     <button><i class="fas fa-cloud-download-alt"></i></button>
                 </div>
            </div>
        </section>

    </main>

    <script>
        const supabaseUrl = 'https://ftsfdcyfjhhjyagietts.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ0c2ZkY3lmamhoanlhZ2lldHRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMTI1NTcsImV4cCI6MjA5NDg4ODU1N30.i7zRKjAxs2jLOaPTN8ssOExhqurIOte5MkrzvpRbBiA';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let user = null;
        let role = null;

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data: userData, error } = await _supabase
                .from('users_meta')
                .select('*')
                .eq('email', email)
                .eq('password', password)
                .single();

            if (error || !userData) {
                alert("خطأ في البيانات!");
                return;
            }

            const { data: roleData } = await _supabase
                .from('user_roles')
                .select('*')
                .eq('user_id', userData.id)
                .single();

            user = userData;
            role = roleData ? roleData.role : 'طالبة';
            
            initApp();
        }

        function initApp() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('userNameDisplay').innerText = user.full_name;
            document.getElementById('userRoleDisplay').innerText = role;
            
            // إظهار اللوحة المناسبة
            if (role === 'قائدة') showSection('leaderDash');
            else if (role === 'مدخلة') showSection('entryDash');
            else if (role === 'طالبة') showSection('studentDash');

            if(role === 'طالبة') renderJuzMap();
        }

        function showSection(id) {
            document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function renderJuzMap() {
            const map = document.getElementById('juzMap');
            map.innerHTML = '';
            for (let i = 1; i <= 30; i++) {
                const box = document.createElement('div');
                box.className = `juz-box ${i <= 3 ? 'juz-done' : ''}`;
                box.innerText = i;
                map.appendChild(box);
            }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        function logout() { location.reload(); }
    </script>
</body>
    </html>
