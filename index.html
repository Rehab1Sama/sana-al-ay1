<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">
    <title>منظومة سَنا الآي المتكاملة</title>
    <script src=\"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2\"></script>
    <script src=\"https://cdn.tailwindcss.com\"></script>
    <script src=\"https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js\"></script>
    <link href=\"https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap\" rel=\"stylesheet\">
    <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css\">
    <style>
        * { font-family: 'Tajawal', sans-serif !important; font-style: normal !important; transition: all 0.2s; }
        body { background-color: #f8faff; margin: 0; }
        .navy-bg { background-color: #2d3a6d; }
        .navy-text { color: #2d3a6d; }
        .sidebar { width: 280px; height: 100vh; background: white; border-left: 2px solid #f3e8ff; position: fixed; right: 0; top: 0; z-index: 100; transform: translateX(100%); }
        .sidebar.active { transform: translateX(0); }
        .main-content { margin-right: 0; width: 100%; padding: 20px; min-height: 100vh; }
        @media (min-width: 1024px) { .sidebar { transform: translateX(0); } .main-content { margin-right: 280px; } }
        .card-custom { background: white; border-radius: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid #f1f5f9; }
        .hidden { display: none !important; }
        .form-input { width: 100%; padding: 12px; border-radius: 15px; background: #f9fafb; border: 1px solid #e5e7eb; outline: none; font-size: 14px; }
        .form-input:focus { ring: 2px; ring-color: #8b5cf6; }
    </style>
</head>
<body>

    <button onclick=\"toggleSidebar()\" class=\"fixed top-4 right-4 z-[110] bg-white p-3 rounded-2xl shadow-lg lg:hidden\"><i class=\"fas fa-bars navy-text\"></i></button>

    <aside id=\"sidebar\" class=\"sidebar p-6 flex flex-col gap-6 shadow-xl\">
        <div class=\"text-center\"><img src=\"https://i.ibb.co/GfyXZGkG/IMG-20260408-WA0004.jpg\" class=\"w-20 mx-auto mb-2\"><h2 class=\"text-lg font-black navy-text\">سَنا الآي</h2></div>
        <div id=\"authLinks\" class=\"flex flex-col gap-2\">
            <button onclick=\"showScreen('home')\" class=\"p-3 text-right font-bold text-sm navy-text hover:bg-purple-50 rounded-xl\"><i class=\"fas fa-home ml-2\"></i> الرئيسية</button>
            <button onclick=\"showScreen('register')\" class=\"p-3 text-right font-bold text-sm navy-text hover:bg-purple-50 rounded-xl\"><i class=\"fas fa-user-plus ml-2\"></i> ركن التسجيل</button>
            <button onclick=\"showScreen('login')\" id=\"loginSidebarBtn\" class=\"p-3 text-right font-bold text-sm navy-text hover:bg-purple-50 rounded-xl\"><i class=\"fas fa-sign-in-alt ml-2\"></i> دخول المنظومة</button>
        </div>
        <div id=\"userProfile\" class=\"hidden bg-purple-50 p-4 rounded-3xl text-center\">
            <p id=\"displayUserName\" class=\"text-xs font-bold navy-text\">--</p>
            <p id=\"displayUserRole\" class=\"text-[9px] text-purple-500 font-black\"></p>
        </div>
        <nav id=\"navLinks\" class=\"flex flex-col gap-2 mt-4 hidden\"></nav>
        <button onclick=\"logout()\" id=\"logoutBtn\" class=\"hidden mt-auto p-4 text-red-400 text-xs font-bold border-t flex items-center gap-2\"><i class=\"fas fa-power-off\"></i> خروج</button>
    </aside>

    <main class=\"main-content\">
        <!-- 1. الشاشة الرئيسية والمتجر -->
        <section id=\"screen-home\" class=\"space-y-12\">
            <div class=\"text-center py-20 bg-gradient-to-b from-purple-50 to-white rounded-[50px]\">
                <h1 class=\"text-4xl font-black navy-text mb-4\">مقرأة سَنا الآي ☁️</h1>
                <p class=\"text-gray-500 italic\">منظومة تعليمية تقنية في خدمة كتاب الله</p>
            </div>
            <div id=\"store-list\" class=\"grid grid-cols-1 md:grid-cols-3 gap-6\"></div>
        </section>

        <!-- 2. ركن التسجيل -->
        <section id=\"screen-register\" class=\"hidden max-w-2xl mx-auto space-y-8\">
            <div class=\"card-custom p-10 text-center\">
                <h2 class=\"text-2xl font-black navy-text mb-8\">انضمي إلينا 🌸</h2>
                <div class=\"grid grid-cols-2 gap-4 mb-10\">
                    <button onclick=\"setRegType('staff')\" id=\"reg-staff-btn\" class=\"p-4 border-2 rounded-3xl font-bold navy-text\">متطوعة (كادر)</button>
                    <button onclick=\"setRegType('student')\" id=\"reg-student-btn\" class=\"p-4 border-2 rounded-3xl font-bold navy-text\">طالبة</button>
                </div>
                <div id=\"regForm\" class=\"hidden space-y-4 text-right\">
                    <input type=\"text\" id=\"reg-name\" placeholder=\"الاسم الرباعي\" class=\"form-input\">
                    <input type=\"email\" id=\"reg-email\" placeholder=\"البريد الإلكتروني\" class=\"form-input\">
                    <input type=\"password\" id=\"reg-pass\" placeholder=\"كلمة المرور\" class=\"form-input\">
                    <input type=\"text\" id=\"reg-phone\" placeholder=\"رقم الجوال\" class=\"form-input\">
                    <div id=\"staff-fields\" class=\"hidden space-y-4\">
                        <select id=\"reg-role\" class=\"form-input\"><option value=\"معلمة\">معلمة</option><option value=\"مشرفة\">مشرفة</option><option value=\"مدخلة\">مدخلة بيانات</option></select>
                        <select id=\"reg-circle\" class=\"form-input\"></select>
                    </div>
                    <button onclick=\"submitRegistration()\" class=\"w-full py-4 navy-bg text-white font-bold rounded-2xl shadow-lg\">إرسال الطلب</button>
                </div>
            </div>
        </section>

        <!-- 3. الدخول -->
        <section id=\"screen-login\" class=\"hidden flex items-center justify-center min-h-[70vh]\">
            <div class=\"max-w-md w-full bg-white p-10 rounded-[50px] shadow-2xl text-center\">
                <h2 class=\"text-2xl font-black navy-text mb-8\">دخول الأعضاء</h2>
                <input type=\"email\" id=\"l-email\" placeholder=\"البريد\" class=\"form-input mb-4\">
                <input type=\"password\" id=\"l-pass\" placeholder=\"الرمز\" class=\"form-input mb-6\">
                <button onclick=\"handleLogin()\" class=\"w-full py-4 navy-bg text-white font-bold rounded-2xl\">دخول</button>
            </div>
        </section>

        <!-- 4. لوحة القائدة -->
        <section id=\"screen-leader\" class=\"hidden space-y-8\">
            <div class=\"flex justify-between items-center\">
                <h2 class=\"text-2xl font-black navy-text\">لوحة القائدة 🌸</h2>
                <button onclick=\"exportStaff()\" class=\"p-3 bg-emerald-500 text-white rounded-xl text-xs font-bold\">تصدير الكوادر Excel</button>
            </div>
            <div class=\"grid grid-cols-1 md:grid-cols-2 gap-6\">
                <div class=\"card-custom p-8 border-r-8 border-purple-500\">
                    <h4 class=\"font-bold mb-4\">إدارة المتجر</h4>
                    <input id=\"st-name\" placeholder=\"اسم المنتج\" class=\"form-input mb-2\">
                    <input id=\"st-price\" placeholder=\"السعر\" class=\"form-input mb-4\">
                    <button onclick=\"addStore()\" class=\"w-full py-3 navy-bg text-white rounded-xl\">نشر</button>
                </div>
                <div class=\"card-custom p-8 border-r-8 border-blue-500\">
                    <h4 class=\"font-bold mb-4\">طلبات التسجيل الجديدة</h4>
                    <div id=\"pending-list\" class=\"text-xs text-gray-400\">لا يوجد طلبات حالياً</div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const supabaseUrl = 'https://ftsfdcyfjhhjyagietts.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ0c2ZkY3lmamhoanlhZ2lldHRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMTI1NTcsImV4cCI6MjA5NDg4ODU1N30.i7zRKjAxs2jLOaPTN8ssOExhqurIOte5MkrzvpRbBiA';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let user = null; let regType = '';

        function showScreen(id) {
            document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
            document.getElementById('screen-' + id).classList.remove('hidden');
            if(window.innerWidth < 1024) toggleSidebar();
        }

        async function setRegType(type) {
            regType = type;
            document.getElementById('regForm').classList.remove('hidden');
            if(type === 'staff') {
                document.getElementById('staff-fields').classList.remove('hidden');
                const { data } = await _supabase.from('circles').select('id, name');
                const sel = document.getElementById('reg-circle');
                sel.innerHTML = data.map(c => `<option value=\"${c.id}\">${c.name}</option>`).join('');
            } else {
                document.getElementById('staff-fields').classList.add('hidden');
            }
        }

        async function submitRegistration() {
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;
            const { data: u, error } = await _supabase.from('users_meta').insert([{ full_name: name, email: email, password: pass, phone: document.getElementById('reg-phone').value }]).select().single();
            
            if(u) {
                const role = regType === 'staff' ? document.getElementById('reg-role').value : 'طالبة';
                const circle = regType === 'staff' ? document.getElementById('reg-circle').value : null;
                await _supabase.from('user_roles').insert([{ user_id: u.id, role: role, circle_id: circle, is_active: (regType === 'staff') }]);
                alert('تم تقديم طلبك بنجاح!');
                showScreen('home');
            }
        }

        async function handleLogin() {
            const email = document.getElementById('l-email').value;
            const pass = document.getElementById('l-pass').value;
            const { data: u } = await _supabase.from('users_meta').select('*').eq('email', email).eq('password', pass).single();
            if(!u) return alert('خطأ!');
            const { data: r } = await _supabase.from('user_roles').select('*').eq('user_id', u.id);
            user = u;
            document.getElementById('userProfile').classList.remove('hidden');
            document.getElementById('displayUserName').innerText = u.full_name;
            document.getElementById('displayUserRole').innerText = r[0].role;
            if(r[0].role === 'قائدة') showScreen('leader');
            else showScreen('home');
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }
        function logout() { location.reload(); }
    </script>
</body>
    </html>
