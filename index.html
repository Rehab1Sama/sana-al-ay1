<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Tajawal', sans-serif !important; font-style: normal !important; }
        body { background-color: #f8faff; }
        .navy-bg { background-color: #2d3a6d; }
    </style>
</head>
<body>
    <div id="app">
        <!-- صفحة الدخول -->
        <div id="login-screen" class="flex items-center justify-center h-screen">
            <div class="bg-white p-10 rounded-[40px] shadow-2xl text-center w-full max-w-sm border border-purple-100">
                <h2 class="text-2xl font-black text-[#2d3a6d] mb-6">دخول القائدة</h2>
                <input type="email" id="email" placeholder="البريد الإلكتروني" class="w-full p-4 mb-4 bg-gray-50 rounded-2xl outline-none ring-1 ring-gray-100 focus:ring-2 focus:ring-purple-400">
                <input type="password" id="pass" placeholder="كلمة المرور" class="w-full p-4 mb-6 bg-gray-50 rounded-2xl outline-none ring-1 ring-gray-100 focus:ring-2 focus:ring-purple-400">
                <button onclick="handleLogin()" class="w-full py-4 navy-bg text-white font-bold rounded-2xl">تسجيل الدخول</button>
                <p id="msg" class="text-red-500 text-xs mt-4"></p>
            </div>
        </div>

        <!-- لوحة القائدة (مخفية) -->
        <div id="leader-screen" class="hidden p-6">
            <header class="flex justify-between items-center mb-10">
                <h1 class="text-2xl font-black text-[#2d3a6d]">لوحة تحكم القائدة 🌸</h1>
                <button onclick="location.reload()" class="text-red-500 text-xs font-bold">خروج</button>
            </header>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-white p-8 rounded-[35px] shadow-sm border-r-8 border-purple-500">
                    <p class="text-gray-400 text-xs font-bold uppercase">إجمالي أوجه الحفظ</p>
                    <h3 class="text-4xl font-black text-[#2d3a6d] mt-2">145.5</h3>
                </div>
                <div class="bg-white p-8 rounded-[35px] shadow-sm border-r-8 border-red-500">
                    <p class="text-gray-400 text-xs font-bold uppercase">إنذارات غياب</p>
                    <h3 class="text-4xl font-black text-[#2d3a6d] mt-2">5</h3>
                </div>
            </div>

            <div class="mt-10 bg-white p-8 rounded-[40px] border-2 border-dashed border-purple-100 text-center">
                <h4 class="font-bold text-[#2d3a6d]">باني المتجر المطور</h4>
                <p class=\"text-xs text-gray-400 mt-2\">جاري تفعيل إمكانية إضافة الصور والمنتجات...</p>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://ftsfdcyfjhhjyagietts.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ0c2ZkY3lmamhoanlhZ2lldHRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMTI1NTcsImV4cCI6MjA5NDg4ODU1N30.i7zRKjAxs2jLOaPTN8ssOExhqurIOte5MkrzvpRbBiA';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        async function handleLogin() {
            const e = document.getElementById('email').value.trim();
            const p = document.getElementById('pass').value;
            const m = document.getElementById('msg');
            m.innerText = "جاري التحقق...";

            const { data, error } = await _supabase.from('users_meta').select('id, full_name').eq('email', e).eq('password', p).single();

            if (error || !data) {
                m.innerText = "البريد أو الرمز خطأ!";
                return;
            }

            const { data: roleData } = await _supabase.from('user_roles').select('role').eq('user_id', data.id).single();

            if (roleData && (roleData.role.includes("قائدة") || roleData.role === "قائدة")) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('leader-screen').classList.remove('hidden');
            } else {
                m.innerText = "عذراً، هذا الحساب ليس له صلاحية قائدة. الرتبة الحالية: " + (roleData ? roleData.role : "طالبة");
            }
        }
    </script>
</body>
</html>
